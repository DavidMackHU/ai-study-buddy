name: CI / Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Jest tests
        run: npm test
        working-directory: backend

  frontend-typecheck:
    name: Frontend type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck]
    # Only deploy on pushes to main/master (not PRs)
    if: github.event_name == 'push'

    steps:
      - name: Trigger backend deploy
        run: curl -s "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" -X POST --fail-with-body
        if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}

      - name: Trigger frontend deploy
        run: curl -s "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" -X POST --fail-with-body
        if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
